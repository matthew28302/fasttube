services:
  fasttube:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fasttube-engine
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - RUN_HOST=0.0.0.0
      - RUN_PORT=9000
      - MAX_CONCURRENT_DOWNLOADS=3
      - LOG_LEVEL=INFO
    env_file:
      - .env
    volumes:
      - ./music:/app/music
      - ./cookies:/app/cookies
      - ./cache:/app/cache
      - ./logs:/app/logs
      - ./playlists.json:/app/playlists.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
